name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and verify
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          jar="target/rulerefactor-${version}.jar"
          test -f "$jar"
          test "$(java -jar "$jar" --version)" = "RuleRefactor ${version}"
          cp "$jar" target/rulerefactor.jar
          printf 'VERSION=%s\nJAR=%s\n' "$version" "$jar" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "RuleRefactor $VERSION" \
              --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "$JAR" \
            target/rulerefactor.jar \
            --clobber
